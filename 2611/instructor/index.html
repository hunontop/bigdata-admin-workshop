async function open_(pw){

  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:D.n,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);

}

if(!window.crypto||!crypto.subtle){document.getElementById('m').textContent='이 주소는 https로 열어야 합니다';}
else{var saved=ss('ws-pw');if(saved)open_(saved).catch(function(){});}
